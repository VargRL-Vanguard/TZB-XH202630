<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#4F6EF7" />
    <title>领域知识个性化生成与多智能体协同决策系统</title>
    <style>
      /* 首屏加载态（15 号任务书 T3）：CSS 内联不依赖 JS，Vue 挂载后自动替换 */
      .boot {
        height: 100%;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: 16px;
        background: #f7f8fc;
        font-family: 'PingFang SC', 'Microsoft YaHei', sans-serif;
      }
      .boot__ring {
        width: 44px;
        height: 44px;
        border-radius: 50%;
        border: 4px solid rgba(79, 110, 247, 0.15);
        border-top-color: #4f6ef7;
        animation: boot-spin 0.9s linear infinite;
      }
      .boot__text {
        font-size: 14px;
        color: #6b7280;
      }
      .boot__name {
        font-size: 12px;
        color: #9ca3af;
      }
      @keyframes boot-spin {
        to {
          transform: rotate(360deg);
        }
      }
      @media (prefers-reduced-motion: reduce) {
        .boot__ring {
          animation-duration: 3s;
        }
      }
    </style>
  </head>
  <body>
    <div id="app">
      <div class="boot">
        <div class="boot__ring"></div>
        <div class="boot__text">系统加载中…</div>
        <div class="boot__name">领域知识个性化生成与多智能体协同决策系统</div>
      </div>
    </div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
