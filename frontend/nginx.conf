# 前端 nginx：静态托管 + API/WS 反代（同源部署，演示机换 IP 也不用改前端配置）
server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # SPA 路由回退（项目现为 hash 路由，此项为未来 history 路由兜底）
    location / {
        try_files $uri $uri/ /index.html;
    }

    # index.html 禁缓存：发版后浏览器必须拿到最新 chunk hash 引用
    # （否则缓存的旧 index.html 一直指向旧 JS，出现"部署了新代码但页面不变"）
    location = /index.html {
        add_header Cache-Control "no-cache, no-store, must-revalidate";
        expires off;
    }

    # REST API 反代后端容器
    location /api/ {
        proxy_pass http://backend:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }

    # WebSocket 反代（/ws 升级头必带）
    location /ws {
        proxy_pass http://backend:8000;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_read_timeout 300s;   # 覆盖默认 60s，避免心跳间隙被掐断
        proxy_send_timeout 300s;
    }

    # Swagger 文档（联调期方便直接从浏览器开后端 /docs）
    location /docs {
        proxy_pass http://backend:8000;
        proxy_set_header Host $host;
    }
    location /openapi.json {
        proxy_pass http://backend:8000;
        proxy_set_header Host $host;
    }

    # 静态资源缓存（Vite 产物带 hash，可长缓存）
    location /assets/ {
        expires 30d;
        add_header Cache-Control "public, immutable";
    }
}
