# 一键容器化：docker compose up -d --build
# 拓扑：mysql(内网) + backend(8000) + frontend(nginx:80 → 宿主 8080)
# 访问：http://127.0.0.1:8080 （API/WS 同源反代，无需关心 8000 端口）
services:
  mysql:
    image: mysql:8.4
    container_name: tzb-mysql
    environment:
      MYSQL_ROOT_PASSWORD: tzb2026
      TZ: Asia/Shanghai
    volumes:
      - mysql-data:/var/lib/mysql
      - ./docker/mysql-init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "127.0.0.1", "-uroot", "-ptzb2026"]
      interval: 5s
      timeout: 3s
      retries: 30
    restart: unless-stopped

  backend:
    build:
      context: .
      dockerfile: docker/backend.Dockerfile
    container_name: tzb-backend
    # AI Key 等敏感配置从项目根 .env 注入（.env 不进镜像、不进 git）
    env_file:
      - .env
    environment:
      ENV: prod
      PORT: "8000"
      JWT_SECRET: tzb-jwt-secret-docker-demo
      # 四区数据库：容器网络内主机名 mysql
      # 注意：environment 优先级高于 env_file，会覆盖 .env 里的 localhost 连接串，
      # AI Key（CHAT/PATH/SUGGEST/EMBED_AI_*）则从 .env 透传进容器
      # 注意 C 区是同步 create_engine，必须用 pymysql 方言（本地开发实际走 sqlite 兜底，
      # 因 C 区 config 只读 os.environ 不读 .env；容器里环境变量注入后 C 区首次真正走 MySQL）
      USER_CHAT_DB_URL: mysql+aiomysql://root:tzb2026@mysql:3306/tzb_user_chat
      STUDENT_DATA_DB_URL: mysql+aiomysql://root:tzb2026@mysql:3306/tzb_student_data
      LEARNING_CONTENT_DB_URL: mysql+pymysql://root:tzb2026@mysql:3306/tzb_learning_content
      AI_INTEGRATION_DB_URL: mysql+aiomysql://root:tzb2026@mysql:3306/tzb_ai_integration
    ports:
      - "8000:8000"   # 暴露给宿主：Swagger /docs 与直连调试用；浏览器正式入口走 8080
    depends_on:
      mysql:
        condition: service_healthy
    restart: unless-stopped

  frontend:
    build:
      context: ./frontend
      dockerfile: ../docker/frontend.Dockerfile
      args:
        VITE_API_BASE: /
    container_name: tzb-frontend
    ports:
      - "8080:80"
    depends_on:
      - backend
    restart: unless-stopped

volumes:
  mysql-data:
