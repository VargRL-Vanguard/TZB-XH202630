<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>智能助手 - 聊天</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <!-- 背景装饰 -->
    <div class="background-decoration">
        <div class="decorative-blob"></div>
        <div class="decorative-blob"></div>
        <div class="decorative-blob"></div>
    </div>
    
    <!-- Toast提示 -->
    <div class="toast" id="toast"></div>
    
    <!-- 滚动到顶部按钮 -->
    <button class="scroll-top-btn" id="scrollTopBtn">🔝</button>
    
    <!-- 聊天框主容器 -->
    <div class="chat-container">
        <!-- 顶部导航栏 -->
        <div class="chat-header">
            <div class="chat-partner">
                <div class="avatar-container">🤖</div>
                <div>
                    <div class="chat-title">智能助手</div>
                    <div class="online-status">
                        <span class="online-dot"></span>
                        <span>在线</span>
                    </div>
                </div>
            </div>
            <div class="header-actions">
                <button class="header-btn" id="themeToggle" title="切换主题">🌙</button>
                <button class="header-btn" title="设置">⚙️</button>
                <button class="header-btn" title="语音">🎙️</button>
            </div>
        </div>
        
        <!-- 搜索框 -->
        <div class="search-container">
            <input type="text" id="searchInput" placeholder="搜索消息... (Ctrl+/)" autocomplete="off">
            <span class="search-icon">🔍</span>
        </div>
        
        <!-- 消息展示区域 -->
        <div class="chat-messages" id="chat-messages">
            <div class="messages-list" id="messages-list">
                <!-- 消息将动态插入这里 -->
            </div>
            <!-- 打字状态指示器 -->
            <div class="typing-indicator" id="typingIndicator">
                <div class="typing-dots">
                    <span></span>
                    <span></span>
                    <span></span>
                </div>
                <span class="typing-text">正在输入...</span>
            </div>
        </div>
        
        <!-- 输入区域 -->
        <div class="chat-input-area">
            <div class="input-container">
                <button class="input-btn emoji-btn" id="emojiBtn" title="表情">😊</button>
                <input 
                    type="text" 
                    id="user-input" 
                    placeholder="输入消息..." 
                    autocomplete="off"
                >
                <button class="send-btn" id="send-btn">➤</button>
            </div>
            <!-- 快捷回复 -->
            <div class="quick-replies" id="quickReplies"></div>
        </div>
    </div>
    
    <!-- 表情选择器 -->
    <div class="emoji-picker" id="emojiPicker"></div>
    </div>

    <script src="script.js"></script>
</body>
</html>
